<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#151517"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="description" content="Edit photos and videos in Lookroom. Colour presets, 124 transitions, masking cuts and local exports."><title>Lookroom — Editor</title><link rel="manifest" href="./manifest.webmanifest"><link rel="icon" href="./icon.png"><link rel="apple-touch-icon" href="./icon.png"><link rel="stylesheet" href="./styles.css"></head>
<body>
<header><a class="brand" href="./" aria-label="Lookroom home"><img src="./icon.png" alt="">Lookroom</a><input id="project-name" aria-label="Project name" value="Untitled Project" maxlength="80"><span id="save-state" role="status">Loading editor…</span><button id="open-project">Open project</button><button id="save-project">Save project</button><button id="export-open" class="primary">Export ↗</button></header>
<main>
<nav aria-label="Editor tools"><button data-panel="media" class="active"><span>▧</span>Media</button><button data-panel="looks"><span>◐</span>Looks</button><button data-panel="transitions"><span>◩</span>Transitions</button><button data-panel="effects"><span>✧</span>Effects</button><button data-panel="text"><span>T</span>Text</button><button data-panel="colour"><span>☷</span>Colour</button><button id="new-project" class="nav-bottom"><span>＋</span>New</button></nav>
<aside id="library"><div class="panel-heading"><h1 id="panel-title">Media</h1><span id="library-count"></span></div><div id="panel-content"></div></aside>
<section id="preview" aria-label="Video preview"><div class="preview-toolbar"><label>Canvas <select id="aspect"><option value="16:9">16:9 Landscape</option><option value="9:16">9:16 Portrait</option><option value="1:1">1:1 Square</option><option value="3:2">3:2 Photo</option><option value="4:5">4:5 Portrait</option></select></label><label><input type="checkbox" id="fill-frame"> Fill frame</label><button id="snapshot" title="Save this frame as PNG">Save frame</button></div><div class="canvas-wrap"><canvas id="picture" width="640" height="360" aria-label="Current frame"></canvas><div id="loading" role="status">Starting the Lookroom engine…</div></div><div class="transport"><span id="time">00:00.00 / 00:00.00</span><div><button id="back" aria-label="Previous frame">‹</button><button id="play" class="play" aria-label="Play">▶</button><button id="forward" aria-label="Next frame">›</button></div><label>Preview <select id="quality"><option value="480">Fast</option><option value="640" selected>Balanced</option><option value="960">Detailed</option></select></label></div></section>
<section id="timeline" aria-label="Timeline"><div class="timeline-toolbar"><button id="undo" title="Undo (Ctrl+Z)">↶ Undo</button><button id="redo" title="Redo (Ctrl+Shift+Z)">↷ Redo</button><button id="split" title="Split at playhead (S)">Split</button><button id="duplicate">Duplicate</button><button id="delete">Delete</button><span class="spacer"></span><button id="move-left" aria-label="Move selected clip earlier">← Earlier</button><button id="move-right" aria-label="Move selected clip later">Later →</button></div><label class="sr-only" for="seek">Playhead</label><input id="seek" type="range" min="0" max="1" step="0.001" value="0"><div id="clips" role="list" aria-label="Clips"></div><div id="clip-settings"></div><div class="timeline-footer"><span id="project-summary">Your media stays on this device.</span><span>Space · play/pause &nbsp; S · split</span></div></section>
</main>
<input type="file" id="media-input" accept="image/*,video/*,audio/*" multiple hidden><input type="file" id="project-input" accept=".json,.lookroom" hidden>
<dialog id="export-dialog"><form method="dialog"><div class="panel-heading"><h2>Export your edit</h2><button value="cancel" aria-label="Close export">✕</button></div></form><p id="export-support"></p><label>Resolution <select id="export-size"><option value="480">480p · fast</option><option value="720" selected>720p</option><option value="1080">1080p · takes more processing</option></select></label><p class="muted">Video export records playback in real time, including sound. Keep this tab open until it finishes.</p><progress id="export-progress" max="1" value="0" hidden></progress><div class="actions"><button id="export-cancel" hidden>Cancel export</button><button id="export-video" class="primary">Export video</button><button id="export-image">Export PNG</button></div></dialog>
<div id="toast" role="status" aria-live="polite"></div><noscript>Lookroom needs JavaScript and WebAssembly to edit media.</noscript>
<script type="module" src="./app.js"></script></body></html>
