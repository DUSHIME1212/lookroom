# Builds and tests Lookroom on Linux, macOS and Windows, and packages each one.
# Pushing a tag such as v0.2.0 also attaches the packages to a GitHub release.
name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  linux:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: System libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libasound2-dev libgtk-3-dev libxkbcommon-dev \
            libwayland-dev libxrandr-dev libxi-dev libxcursor-dev libgl1-mesa-dev ffmpeg fonts-dejavu-core
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --release
      - run: bash packaging/build-linux.sh
      - uses: actions/upload-artifact@v4
        with:
          name: lookroom-linux-x86_64
          path: dist/*.tar.gz

  macos:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Tools for the tests
        run: brew install ffmpeg
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --release
      - run: bash packaging/build-macos.sh
      - uses: actions/upload-artifact@v4
        with:
          name: lookroom-macos-universal
          path: dist/*.zip

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release
      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Compress-Archive -Path target/release/lookroom.exe, MECHANICS.md -DestinationPath dist/lookroom-windows-x86_64.zip
      - uses: actions/upload-artifact@v4
        with:
          name: lookroom-windows-x86_64
          path: dist/*.zip

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [linux, macos, windows]
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
