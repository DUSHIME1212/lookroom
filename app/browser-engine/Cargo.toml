[package]
name = "lookroom-browser"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wasm-bindgen = "=0.2.130"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
rayon = "1.12.0"
resvg = { version = "0.45.1", default-features = false, features = ["text", "system-fonts", "memmap-fonts", "raster-images"] }

[profile.release]
opt-level = 3
lto = "thin"
strip = true

